[package]
name = "nashdex"
version = "0.1.0"
edition = "2024"
description = "Research solver for simultaneous-move Pokémon Champions endgames"
repository = "https://github.com/sandsowkd/vgc-solver"
publish = false

[dependencies]
ninjask = { git = "https://github.com/dcabatin/Ninjask", rev = "8a59175f3915771285cd16fce5d7f788610ff242" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rayon = "1.11"
clap = { version = "4.5", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
